
name: TONY - Descomprimir y Compilar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Construir TONY
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar herramientas Android
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Buscar y descomprimir ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -type f -iname "*.zip" \
            -not -path "./.git/*" \
            -print -quit)

          if [ -n "$ZIP_FILE" ]; then
            echo "ZIP encontrado: $ZIP_FILE"

            mkdir -p "$RUNNER_TEMP/tony_project"

            unzip -o "$ZIP_FILE" \
              -d "$RUNNER_TEMP/tony_project"

            echo "Proyecto descomprimido correctamente"
          else
            echo "No se encontro ZIP."
            echo "Se buscara el proyecto en el repositorio."
          fi

      - name: Encontrar proyecto Android
        shell: bash
        run: |
          set -e

          PROJECT_FILE=$(find "$RUNNER_TEMP/tony_project" . \
            -type f \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \) \
            -print -quit 2>/dev/null || true)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: No se encontro settings.gradle"
            echo "El ZIP debe contener un proyecto Android Gradle."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Proyecto encontrado en:"
          echo "$PROJECT_DIR"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar Gradle Wrapper
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "Gradle Wrapper encontrado"
          else
            echo "No hay Gradle Wrapper."
            echo "Se usara Gradle instalado."
          fi

      - name: Compilar APK de TONY
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Localizar APK
        shell: bash
        run: |
          APK_FILE=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: No se genero el APK"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/tony_apk"

          cp "$APK_FILE" \
            "$RUNNER_TEMP/tony_apk/TONY-debug.apk"

          echo "APK generado correctamente"

      - name: Publicar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: TONY-Android-APK
          path: ${{ runner.temp }}/tony_apk/TONY-debug.apk
          if-no-files-found: error
          retention-days: 30
